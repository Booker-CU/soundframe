<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"
    />
    <title>SoundFrame</title>
    <meta name="fc:miniapp" content='__FC_MINIAPP_EMBED__' />
    <meta name="fc:frame" content='__FC_MINIAPP_EMBED__' />
    <script src="/miniapp-sdk.js"></script>
    <script>
      try {
        if (typeof miniapp !== 'undefined' && miniapp.sdk) {
          window.sdk = miniapp.sdk
          void miniapp.sdk.actions.ready()
        } else {
          console.warn('[SoundFrame] miniapp SDK unavailable; share will use cast intent URL')
        }
      } catch (err) {
        console.error('[SoundFrame] SDK init failed:', err)
      }
    </script>
    <style>
      :root {
        color-scheme: dark;
        --primary: #ff5500;
        --bg: #121212;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        background: var(--bg);
        color: #ffffff;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      }
      body.layout-home {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
      }
      main {
        position: relative;
        isolation: isolate;
        width: 100%;
        max-width: 560px;
        margin: 0 auto;
        padding: 12px 12px 24px;
        text-align: center;
      }
      body.layout-home main {
        max-width: 420px;
        padding: 0;
      }
      h1 {
        margin: 0 0 12px;
        font-size: 1.5rem;
      }
      p {
        margin: 0;
        line-height: 1.5;
        color: #c8c8c8;
      }
      a {
        color: var(--primary);
      }
      .artwork-wrap {
        width: 100%;
        display: flex;
        justify-content: center;
      }
      .artwork-hero {
        position: relative;
        width: min(100%, 360px);
        max-width: 360px;
        aspect-ratio: 1 / 1;
        border-radius: 12px;
        overflow: hidden;
        background:
          radial-gradient(circle at 28% 22%, rgba(255, 85, 0, 0.42), transparent 52%),
          linear-gradient(155deg, #2a1810 0%, var(--bg) 48%, #1a1a1a 100%);
        box-shadow: inset 0 0 0 1px rgba(255, 85, 0, 0.18);
      }
      .artwork-hero::after {
        content: '';
        position: absolute;
        inset: 0;
        background: linear-gradient(180deg, transparent 62%, rgba(0, 0, 0, 0.35) 100%);
        pointer-events: none;
        z-index: 2;
      }
      .artwork-hero .artwork {
        position: absolute;
        inset: 0;
        z-index: 1;
        width: 100%;
        height: 100%;
        display: block;
        object-fit: cover;
        opacity: 0;
        transition: opacity 0.2s ease;
      }
      .artwork-hero .artwork.is-ready {
        opacity: 1;
      }
      .artwork-hero .artwork.is-broken {
        display: none;
      }
      .player-wrap {
        position: relative;
        z-index: 0;
        width: 100%;
        height: 166px;
        margin-top: 12px;
        overflow: hidden;
        border-radius: 12px;
      }
      .player {
        display: block;
        width: 100%;
        height: 166px;
        border: 0;
      }
      .share {
        position: relative;
        z-index: 2;
        margin-top: 14px;
        width: 100%;
        border: 0;
        border-radius: 10px;
        padding: 12px 14px;
        background: var(--primary);
        color: #ffffff;
        font-weight: 700;
        font-size: 16px;
        cursor: pointer;
        pointer-events: auto;
        touch-action: manipulation;
        transition: background-color 0.2s ease, transform 0.1s ease;
      }
      .share:hover {
        background-color: #2a2a2a;
        opacity: 0.9;
      }
      .share:active {
        transform: scale(0.98);
      }
      #share-btn {
        position: relative;
        z-index: 2;
      }
      .hidden {
        display: none;
      }
      .frame-url-label {
        margin-top: 16px;
        font-size: 0.9rem;
      }
      .frame-url {
        display: block;
        margin: 8px 0 12px;
        padding: 10px 12px;
        border-radius: 8px;
        background: #1b1b1b;
        color: #e8e8e8;
        font-size: 0.8rem;
        word-break: break-all;
        text-align: left;
      }
    </style>
  </head>
  <body>
    <main id="app"></main>
    <script>
      const TRACK_ID_RE = /^[A-Za-z0-9]+$/
      const PRIMARY = '#ff5500'

      function decodeArtworkQueryParam(param) {
        const trimmed = param.trim()
        if (!trimmed) return undefined
        if (/^https?:\/\//i.test(trimmed)) return trimmed
        try {
          const normalized = trimmed.replace(/-/g, '+').replace(/_/g, '/')
          const padLength = (4 - (normalized.length % 4)) % 4
          const padded = normalized + '='.repeat(padLength)
          const binary = atob(padded)
          const bytes = Uint8Array.from(binary, (c) => c.charCodeAt(0))
          return new TextDecoder().decode(bytes)
        } catch {
          return undefined
        }
      }

      function parseArtworkFromQuery(param) {
        if (!param || !param.trim()) return undefined
        const decoded = decodeArtworkQueryParam(param)
        if (!decoded || !/^https?:\/\//i.test(decoded)) return undefined
        return decoded
      }

      function buildPlayerSrc(trackId) {
        const colorParam = '%23ff5500'
        const apiTrackUrlParam = 'https%3A//api.soundcloud.com/tracks/' + encodeURIComponent(trackId)
        return 'https://w.soundcloud.com/player/?url=' + apiTrackUrlParam + '&color=' + colorParam + '&auto_play=false'
      }

      function parseTrackIdFromPath() {
        const parts = window.location.pathname.replace(/\/+$/, '').split('/')
        const playerIndex = parts.lastIndexOf('player')
        if (playerIndex === -1) return undefined
        const trackId = parts[playerIndex + 1]
        if (!trackId || !TRACK_ID_RE.test(trackId)) return undefined
        return trackId
      }

      function renderHome(app) {
        document.body.className = 'layout-home'
        document.title = 'SoundFrame'
        const frameUrl = window.location.origin + '/frame'
        app.innerHTML =
          '<h1>SoundFrame</h1>' +
          '<p>Open a shared player from a cast, or test the frame in Warpcast Developer Tools.</p>' +
          '<p class="frame-url-label">Frame URL (paste in the <strong>Frame</strong> tab, not the mini app URL):</p>' +
          '<code class="frame-url">' + frameUrl + '</code>' +
          '<button id="copy-frame-url" class="share" type="button">Copy frame URL</button>'
        const copyBtn = document.getElementById('copy-frame-url')
        if (copyBtn) {
          copyBtn.addEventListener('click', async () => {
            try {
              await navigator.clipboard.writeText(frameUrl)
              copyBtn.textContent = 'Copied!'
            } catch {
              copyBtn.textContent = frameUrl
            }
          })
        }
      }

      const CAST_SHARE_TEXT = 'Listening to music on SoundFrame! 🎵 Check out this track:'
      const FRAME_EMBED_URL = 'https://soundframe.vercel.app/frame'

      function buildCastComposeUrl(text, embedUrl) {
        return (
          'https://farcaster.xyz/~/compose?text=' +
          encodeURIComponent(text) +
          '&embeds[]=' +
          encodeURIComponent(embedUrl)
        )
      }

      async function openCastCompose() {
        try {
          const embeds = [FRAME_EMBED_URL]
          if (window.sdk && window.sdk.actions && window.sdk.actions.composeCast) {
            console.log('[SoundFrame] composeCast via SDK')
            await window.sdk.actions.composeCast({ text: CAST_SHARE_TEXT, embeds })
            return
          }

          const composeUrl = buildCastComposeUrl(CAST_SHARE_TEXT, FRAME_EMBED_URL)
          console.log('[SoundFrame] opening cast intent URL:', composeUrl)
          if (window.sdk && window.sdk.actions && window.sdk.actions.openUrl) {
            await window.sdk.actions.openUrl({ url: composeUrl })
          } else {
            window.location.href = composeUrl
          }
        } catch (err) {
          console.error('[SoundFrame] openCastCompose failed:', err)
        }
      }

      function handleShareClick(event) {
        console.log('Share button clicked!')
        try {
          if (event) {
            event.preventDefault()
            event.stopPropagation()
          }
          void openCastCompose()
        } catch (err) {
          console.error('[SoundFrame] Share click handler failed:', err)
        }
      }

      window.__soundframeShare = handleShareClick

      function renderTrack(app, trackId) {
        document.body.className = 'layout-track'
        document.title = 'SoundFrame Player'
        const artworkSrc = parseArtworkFromQuery(new URLSearchParams(window.location.search).get('artwork') || '')
        const artworkImg = artworkSrc
          ? '<img class="artwork" width="360" height="360" src="' + artworkSrc + '" alt="Track artwork" decoding="async" onload="this.classList.add(\'is-ready\')" onerror="this.classList.add(\'is-broken\')" />'
          : ''
        const artworkHtml = '<div class="artwork-wrap"><div class="artwork-hero">' + artworkImg + '</div></div>'

        app.innerHTML =
          artworkHtml +
          '<div class="player-wrap">' +
          '<iframe class="player" height="166" title="SoundCloud player" scrolling="no" allow="autoplay" src="' + buildPlayerSrc(trackId) + '"></iframe>' +
          '</div>' +
          '<button id="share-btn" class="share" type="button" onclick="window.__soundframeShare(event)">Share</button>'
      }

      function renderUnavailable(app) {
        document.body.className = 'layout-home'
        document.title = 'SoundFrame'
        app.innerHTML = '<p>Track unavailable.</p>'
      }

      const app = document.getElementById('app')
      const trackId = parseTrackIdFromPath()
      if (trackId) {
        renderTrack(app, trackId)
      } else if (window.location.pathname.replace(/\/+$/, '').endsWith('/player')) {
        renderHome(app)
      } else {
        renderUnavailable(app)
      }
    </script>
  </body>
</html>
