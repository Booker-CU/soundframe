<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"
    />
    <title>SoundFrame</title>
    <meta name="fc:miniapp" content='__FC_MINIAPP_EMBED__' />
    <meta name="fc:frame" content='__FC_MINIAPP_EMBED__' />
    <script src="/miniapp-sdk.js"></script>
    <script>
      window.sdk = miniapp.sdk
      miniapp.sdk.actions.ready()
    </script>
    <style>
      :root {
        color-scheme: dark;
        --primary: #ff5500;
        --bg: #121212;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        background: var(--bg);
        color: #ffffff;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      }
      body.layout-home {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
      }
      main {
        width: 100%;
        max-width: 560px;
        margin: 0 auto;
        padding: 12px 12px 24px;
        text-align: center;
      }
      body.layout-home main {
        max-width: 420px;
        padding: 0;
      }
      h1 {
        margin: 0 0 12px;
        font-size: 1.5rem;
      }
      p {
        margin: 0;
        line-height: 1.5;
        color: #c8c8c8;
      }
      a {
        color: var(--primary);
      }
      .artwork-wrap {
        width: 100%;
        display: flex;
        justify-content: center;
      }
      .artwork {
        width: min(100%, 360px);
        height: auto;
        max-width: 360px;
        max-height: 360px;
        aspect-ratio: 1 / 1;
        display: block;
        object-fit: cover;
        border-radius: 12px;
        background: #1b1b1b;
        opacity: 0;
        transition: opacity 0.15s ease;
      }
      .artwork.is-ready {
        opacity: 1;
      }
      .artwork-placeholder {
        width: min(100%, 360px);
        max-width: 360px;
        aspect-ratio: 1 / 1;
        border-radius: 12px;
        background: #1b1b1b;
      }
      .player {
        width: 100%;
        height: 166px;
        border: 0;
        border-radius: 12px;
        margin-top: 12px;
        overflow: hidden;
      }
      .share {
        margin-top: 14px;
        width: 100%;
        border: 0;
        border-radius: 10px;
        padding: 12px 14px;
        background: var(--primary);
        color: #ffffff;
        font-weight: 700;
        font-size: 16px;
        cursor: pointer;
        transition: background-color 0.2s ease, transform 0.1s ease;
      }
      .share:hover {
        background-color: #2a2a2a;
        opacity: 0.9;
      }
      .share:active {
        transform: scale(0.98);
      }
      .hidden {
        display: none;
      }
    </style>
  </head>
  <body>
    <main id="app"></main>
    <script>
      const TRACK_ID_RE = /^[A-Za-z0-9]+$/
      const PRIMARY = '#ff5500'

      function decodeArtworkQueryParam(param) {
        const trimmed = param.trim()
        if (!trimmed) return undefined
        if (/^https?:\/\//i.test(trimmed)) return trimmed
        try {
          const normalized = trimmed.replace(/-/g, '+').replace(/_/g, '/')
          const padLength = (4 - (normalized.length % 4)) % 4
          const padded = normalized + '='.repeat(padLength)
          const binary = atob(padded)
          const bytes = Uint8Array.from(binary, (c) => c.charCodeAt(0))
          return new TextDecoder().decode(bytes)
        } catch {
          return undefined
        }
      }

      function parseArtworkFromQuery(param) {
        if (!param || !param.trim()) return undefined
        const decoded = decodeArtworkQueryParam(param)
        if (!decoded || !/^https?:\/\//i.test(decoded)) return undefined
        return decoded
      }

      function buildPlayerSrc(trackId) {
        const colorParam = '%23ff5500'
        const apiTrackUrlParam = 'https%3A//api.soundcloud.com/tracks/' + encodeURIComponent(trackId)
        return 'https://w.soundcloud.com/player/?url=' + apiTrackUrlParam + '&color=' + colorParam + '&auto_play=false'
      }

      function parseTrackIdFromPath() {
        const parts = window.location.pathname.replace(/\/+$/, '').split('/')
        const playerIndex = parts.lastIndexOf('player')
        if (playerIndex === -1) return undefined
        const trackId = parts[playerIndex + 1]
        if (!trackId || !TRACK_ID_RE.test(trackId)) return undefined
        return trackId
      }

      function renderHome(app) {
        document.body.className = 'layout-home'
        document.title = 'SoundFrame'
        app.innerHTML =
          '<h1>SoundFrame</h1>' +
          '<p>Paste a SoundCloud link in the <a href="/api/frame">frame</a> to load a track, or open a shared player from a cast.</p>'
      }

      function renderTrack(app, trackId) {
        document.body.className = 'layout-track'
        document.title = 'SoundFrame Player'
        const artworkSrc = parseArtworkFromQuery(new URLSearchParams(window.location.search).get('artwork') || '')
        const artworkHtml = artworkSrc
          ? '<img class="artwork" width="360" height="360" src="' + artworkSrc + '" alt="Track artwork" decoding="async" onload="this.classList.add(\'is-ready\')" onerror="this.onerror=null;this.style.visibility=\'hidden\';" />'
          : '<div class="artwork-placeholder" aria-hidden="true"></div>'

        app.innerHTML =
          '<div class="artwork-wrap">' + artworkHtml + '</div>' +
          '<iframe class="player" height="166" title="SoundCloud player" scrolling="no" allow="autoplay" src="' + buildPlayerSrc(trackId) + '"></iframe>' +
          '<button id="share-btn" class="share" type="button">Share</button>'

        const shareBtn = document.getElementById('share-btn')
        if (shareBtn) {
          shareBtn.addEventListener('click', () => {
            const shareText = 'Listening to a mix on SoundFrame! 🎵'
            const warpcastComposeUrl =
              'https://warpcast.com/~/compose?text=' +
              encodeURIComponent(shareText) +
              '&embeds[]=' +
              encodeURIComponent(window.location.href)
            if (window.sdk && window.sdk.actions && window.sdk.actions.openUrl) {
              window.sdk.actions.openUrl({ url: warpcastComposeUrl })
            } else {
              window.open(warpcastComposeUrl, '_blank')
            }
          })
        }
      }

      function renderUnavailable(app) {
        document.body.className = 'layout-home'
        document.title = 'SoundFrame'
        app.innerHTML = '<p>Track unavailable.</p>'
      }

      const app = document.getElementById('app')
      const trackId = parseTrackIdFromPath()
      if (trackId) {
        renderTrack(app, trackId)
      } else if (window.location.pathname.replace(/\/+$/, '').endsWith('/player')) {
        renderHome(app)
      } else {
        renderUnavailable(app)
      }
    </script>
  </body>
</html>
